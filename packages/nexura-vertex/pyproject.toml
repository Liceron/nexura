[project]
name = "nexura-vertex"
version = "0.4.3"
description = "Google Vertex AI (Gemini) provider for Nexura agents, using your Google Cloud login."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Liceron", email = "info@liceron.in" }]
keywords = ["agents", "ai-agents", "llm", "vertex-ai", "gemini", "google-cloud"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Depends on the agent SDK only (not on nexura-runtime), with the same Python range. Was the
# `vertex` extra of nexura-agents and nexura-runtime (google-auth).
dependencies = [
    "nexura-agents==0.4.3",
    "httpx>=0.27.0,<1.0.0",
    "google-auth[requests]>=2.30,<3",
]

[project.urls]
Homepage = "https://github.com/Liceron/nexura"
Documentation = "https://github.com/Liceron/nexura/blob/main/docs/README.md"
Source = "https://github.com/Liceron/nexura"
Issues = "https://github.com/Liceron/nexura/issues"
Changelog = "https://github.com/Liceron/nexura/blob/main/CHANGELOG.md"

[tool.uv.sources]
# Development inside the monorepo uses the workspace copy.
nexura-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexura_vertex"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/pyproject.toml"]
exclude = [
    "**/__pycache__", "**/*.pyc",
    "**/*blueprint*/**", "**/internal/**", "**/product/**", "**/.autopilot/**",
]
