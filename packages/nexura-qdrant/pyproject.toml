[project]
name = "nexura-qdrant"
version = "0.4.2"
description = "Qdrant vector store for nexura-runtime: workspace-scoped collections and immutable index generations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Liceron", email = "info@liceron.in" }]
keywords = ["agents", "rag", "vector-store", "qdrant", "retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Same version as the runtime whose VectorStore protocol it implements.
dependencies = [
    "nexura-runtime==0.4.2",
    "nexura-agents==0.4.2",
    "qdrant-client>=1.12.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/Liceron/nexura"
Documentation = "https://github.com/Liceron/nexura/blob/main/docs/README.md"
Source = "https://github.com/Liceron/nexura"
Issues = "https://github.com/Liceron/nexura/issues"
Changelog = "https://github.com/Liceron/nexura/blob/main/CHANGELOG.md"

[tool.uv.sources]
# Development inside the monorepo uses the workspace copies.
nexura-runtime = { workspace = true }
nexura-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexura_qdrant"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/pyproject.toml"]
exclude = [
    "**/__pycache__", "**/*.pyc",
    "**/*blueprint*/**", "**/internal/**", "**/product/**", "**/.autopilot/**",
]
