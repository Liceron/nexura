[project]
name = "nexura-connectors"
version = "0.7.1"
description = "15 SaaS connectors (Slack, GitHub, Google Drive and Sheets, S3, Postgres and more) as Nexura workflow modules with approval-gated writes."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Liceron", email = "info@liceron.in" }]
keywords = ["agents", "workflows", "connectors", "integrations", "slack", "github", "s3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Same version as the runtime it plugs into: the runtime imports this package when installed
# and registers every connector as a `nexura.connectors.*` workflow module.
dependencies = [
    "nexura-runtime==0.7.1",
    "nexura-agents==0.7.1",
    "httpx>=0.27.0,<1.0.0",
    "httpcore>=1.0.0,<2.0.0",
    "pydantic>=2.7.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/Liceron/nexura"
Documentation = "https://github.com/Liceron/nexura/blob/main/docs/README.md"
Source = "https://github.com/Liceron/nexura"
Issues = "https://github.com/Liceron/nexura/issues"
Changelog = "https://github.com/Liceron/nexura/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# The Postgres connector's real driver; without it the connector fails with MISSING_DEPENDENCY.
postgres = ["asyncpg>=0.30.0,<1.0.0"]

[tool.uv.sources]
# Development inside the monorepo uses the workspace copies.
nexura-runtime = { workspace = true }
nexura-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexura_connectors"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/pyproject.toml"]
exclude = [
    "**/__pycache__", "**/*.pyc",
    "**/*blueprint*/**", "**/internal/**", "**/product/**", "**/.autopilot/**",
]
