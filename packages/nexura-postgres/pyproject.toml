[project]
name = "nexura-postgres"
version = "0.4.1"
description = "PostgreSQL backends for nexura-runtime: durable run and session storage, and a pgvector vector store."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Liceron", email = "info@liceron.in" }]
keywords = ["agents", "workflows", "postgres", "postgresql", "pgvector", "asyncpg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Same version as the runtime it plugs into: get_storage_repository("postgresql://...") in the
# runtime returns this package's PostgresRepository when it is installed.
# The old `nexura-runtime[postgres]` extra also listed sqlalchemy, which no code imported.
dependencies = [
    "nexura-runtime==0.4.1",
    "nexura-agents==0.4.1",
    "asyncpg>=0.30.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/Liceron/nexura"
Documentation = "https://github.com/Liceron/nexura/blob/main/docs/README.md"
Source = "https://github.com/Liceron/nexura"
Issues = "https://github.com/Liceron/nexura/issues"
Changelog = "https://github.com/Liceron/nexura/blob/main/CHANGELOG.md"

[tool.uv.sources]
# Development inside the monorepo uses the workspace copies.
nexura-runtime = { workspace = true }
nexura-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexura_postgres"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/pyproject.toml"]
exclude = [
    "**/__pycache__", "**/*.pyc",
    "**/*blueprint*/**", "**/internal/**", "**/product/**", "**/.autopilot/**",
]
