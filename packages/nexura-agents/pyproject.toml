[project]
name = "nexura-agents"
version = "0.4.0"
description = "Build AI agents with estimated-cost admission control, action approvals, and resumable runs."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Liceron", email = "info@liceron.in" }]
keywords = ["agents", "ai-agents", "llm", "agentic-ai", "tool-calling", "human-in-the-loop", "gemini"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
litellm = ["litellm>=1.104,<2"]
otel = ["opentelemetry-api>=1.20,<2"]

[project.urls]
Source = "https://github.com/Liceron/nexura"
Issues = "https://github.com/Liceron/nexura/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexura_agents"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/pyproject.toml"]
exclude = [
    "**/__pycache__", "**/*.pyc",
    "**/*blueprint*/**", "**/internal/**", "**/product/**", "**/.autopilot/**",
]
