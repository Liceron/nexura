[project]
name = "nexura-guardrails"
version = "0.4.3"
description = "Guardrails for Nexura agents: verdicts, a category taxonomy, fast pre-filters, an LLM judge, local safety models, presets and tiered composition."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Liceron", email = "info@liceron.in" }]
keywords = ["agents", "ai-agents", "llm", "guardrails", "safety", "prompt-injection", "llm-judge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Depends on the agent SDK only (not on nexura-runtime), with the same Python range, and on no
# third-party package of its own. Judge calls go through nexura_agents models, so budgets apply.
dependencies = [
    "nexura-agents==0.4.3",
]

[project.optional-dependencies]
# Empty marker: the LLM judge ships in core and needs no extra dependency
# (`pip install "nexura-guardrails[judge]"` reads naturally in docs).
judge = []
# The local safety-model checks (Llama Guard 3, ShieldGemma, Granite Guardian, Nemotron
# Safety Guard) talk to Ollama or an OpenAI-compatible server over httpx. nexura-agents
# already depends on it with the same range; it is declared here so the extra stays correct
# on its own. No model weights are downloaded or shipped.
ollama = ["httpx>=0.27.0,<1.0.0"]
# YAML policy files (JSON works without it): GuardrailPolicy.from_file / load_policy.
yaml = ["pyyaml>=6"]

# The guardrails.check workflow node; nexura-runtime also registers it when this package is
# installed. BaseModule lives in nexura_agents.contracts, so no runtime dependency is needed.
[project.entry-points."nexura.modules"]
guardrails = "nexura_guardrails.runtime.module:GuardrailCheckModule"

[project.urls]
Homepage = "https://github.com/Liceron/nexura"
Documentation = "https://github.com/Liceron/nexura/blob/main/docs/guardrails-package.md"
Source = "https://github.com/Liceron/nexura"
Issues = "https://github.com/Liceron/nexura/issues"
Changelog = "https://github.com/Liceron/nexura/blob/main/CHANGELOG.md"

[tool.uv.sources]
# Development inside the monorepo uses the workspace copy.
nexura-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexura_guardrails"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/pyproject.toml"]
exclude = [
    "**/__pycache__", "**/*.pyc",
    "**/*blueprint*/**", "**/internal/**", "**/product/**", "**/.autopilot/**",
]
