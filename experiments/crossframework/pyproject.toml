[project]
name = "experiments-crossframework"
version = "0.1.0"
description = "Offline cross-framework MCP governance pilot with fake refunds and reviewer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==2.3.0",
    "nexura-agents==0.4.0",
    "nexura-guardrails==0.4.0",
    "nexura-runtime==0.4.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
]

[tool.uv.sources]
nexura-agents = { path = "../../packages/nexura-agents", editable = true }
nexura-guardrails = { path = "../../packages/nexura-guardrails", editable = true }
nexura-runtime = { path = "../..", editable = true }

# This experiment owns its environment; reference SDKs never enter the root dependencies.
[tool.uv.workspace]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# Pytest defaults confcutdir to this configuration's directory, also with -c from root.
addopts = ["--import-mode=importlib"]
