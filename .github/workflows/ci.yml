# Offline checks only: no provider credentials, no publishing, no deployment.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  postgres-backend:
    # Every service store is on Postgres since WP8, so the service suites run unconditionally.
    # WP11 adds the PgBouncer service (transaction mode, prepared statements off) and its
    # pooled smoke step. No CI job was executed by this change.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: nexura-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      NEXURA_TEST_POSTGRES_URI: postgresql://postgres:nexura-ci-only@127.0.0.1:5432/postgres
      # Fail instead of skipping when the URI is missing or no Postgres test passes.
      NEXURA_REQUIRE_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      # The knowledge index (WP7) needs pgvector. Create it once, in public, before the tests:
      # a per-test schema's search_path holds only that schema, so a first migration there
      # would install the extension into a schema that the test then drops.
      - run: |
          uv run --frozen python - <<'PY'
          import asyncio, os, asyncpg
          async def main():
              conn = await asyncpg.connect(os.environ["NEXURA_TEST_POSTGRES_URI"])
              try:
                  await conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
              finally:
                  await conn.close()
          asyncio.run(main())
          PY
      - run: >-
          uv run --frozen pytest -rs -n auto --dist loadfile tests/postgres
          tests/service/test_workspace_repository_contract.py
          tests/service/test_blob_call_sites.py tests/service/test_blob_retention.py
          tests/service/test_studio_store_contract.py tests/service/test_studio_two_instances.py
          tests/service/test_studio_postgres_wiring.py
          tests/service/test_chat_stores_contract.py
          tests/service/test_chat_stores_postgres_wiring.py
          tests/service/test_secrets_usage_contract.py
          tests/service/test_wp5_postgres_wiring.py
          tests/service/test_knowledge_index_contract.py
          tests/service/test_knowledge_postgres_wiring.py
          tests/service/test_wp8_stores_contract.py
          tests/service/test_wp8_postgres_wiring.py
          tests/service/test_wp9_cloud_run.py
      - name: Knowledge suites on Postgres (WP7)
        run: >-
          uv run --frozen pytest -rs -n auto --dist loadfile --service-backend=postgres
          -m "not sqlite_only" tests/test_knowledge_hybrid.py tests/test_p35a3_embeddings.py
          tests/backend/test_p35a3_knowledge_api.py tests/test_playground_knowledge.py
          tests/backend/test_knowledge_api.py tests/backend/test_security_b7_sessions_knowledge.py
      - name: Evaluations, channels and integrations on Postgres (WP8)
        run: >-
          uv run --frozen pytest -rs -n auto --dist loadfile --service-backend=postgres
          -m "not sqlite_only" tests/test_evaluation_p38_c5.py
          tests/test_evaluation_p38_c5_review.py tests/test_evaluation_p38_c5_round2.py
          tests/test_evaluation_p38_c5_studio_authorization.py
          tests/test_evaluation_p38_c5_studio_recheck.py tests/test_studio_evals_api.py
          tests/backend/b26/test_channels.py tests/backend/test_export_and_tools_api.py
          tests/backend/test_security_b8_sessions_integrations.py
      # Full Postgres mode (WP8): the whole service on one database, no SQLite file.
      # The two deselected tests build the wheels and the TypeScript client; they do not touch
      # the database and run in the python job, which builds those first.
      - name: Service suites on Postgres (WP2–WP8)
        run: >-
          uv run --frozen pytest -rs -n auto --dist loadfile --service-backend=postgres
          --deselect tests/backend/b32/test_release_gate.py::test_wheel_build_and_clean_environment_install
          --deselect tests/backend/b31/test_api_and_clients.py::test_typescript_client_interop
          -m "not sqlite_only" tests/postgres tests/service tests/backend tests/workflows
          tests/p28_seams tests/p35 tests/test_knowledge_hybrid.py tests/test_p35a3_embeddings.py
          tests/test_playground_knowledge.py tests/test_evaluation_p38_c5.py

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: uv sync --frozen --all-extras
      - run: uv run --frozen ruff check src packages tests examples
      - run: >-
          uv run --frozen mypy src packages/nexura-agents/src packages/nexura-connectors/src
          packages/nexura-postgres/src packages/nexura-qdrant/src packages/nexura-sandbox/src
          packages/nexura-studio/src packages/nexura-vertex/src packages/nexura-guardrails/src
      # The suite also checks the TypeScript client, installed wheels and the WASI sandbox.
      - run: npm ci && npm run build
        working-directory: clients/typescript
      - run: uv build --all-packages
      - name: Fetch the pinned CPython WASI runtime (the installer verifies its SHA256)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/python-wasi.zip" \
            https://github.com/brettcannon/cpython-wasi-build/releases/download/v3.13.15/python-3.13.15-wasi_sdk-24.zip
          echo "67e1c32a85d5e0600c0939f5fd4023ca0127f1a9e81f5499697467bda67af78d  $RUNNER_TEMP/python-wasi.zip" | sha256sum -c -
          echo "NEXURA_WASI_RUNTIME_ZIP=$RUNNER_TEMP/python-wasi.zip" >> "$GITHUB_ENV"
      # b22 needs live Postgres/Qdrant services; see the vector-stores job.
      # Files run in parallel, each file on one worker (pytest-xdist); see CONTRIBUTING.md.
      - run: uv run --frozen pytest -n auto --dist loadfile --deselect tests/backend/b22
      - run: uv run --frozen python examples/oss/o07.py

  crossframework:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experiments/crossframework
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
      - run: uv run --frozen python -m crossframework.demo

  agents-python-versions:
    # nexura-agents supports 3.11-3.13; the platform package is 3.12-only.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Test the standalone wheel on Python ${{ matrix.python }}
        # Builds the wheel, installs it in a fresh venv and runs every agent test file
        # that does not need the platform package (see the script's docstring).
        run: uv run --frozen python scripts/test_agents_wheel.py --python ${{ matrix.python }}

  platform-smoke:
    # macOS and Windows checks (P37 B1); required since they first passed on GitHub's runners
    # (2026-10-21). Linux remains the platform the full suite runs on.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - name: Standalone nexura-agents wheel and its test suite
        run: uv run --frozen python scripts/test_agents_wheel.py --python 3.12
      - name: Runtime install and an offline workflow example
        run: |
          uv sync --frozen --extra studio
          uv run --frozen python examples/oss/o07.py
      - name: A generated project passes its own tests
        run: |
          uv run --frozen nexura-runtime init "$RUNNER_TEMP/smoke" --template workflow
          cd "$RUNNER_TEMP/smoke"
          uv run --project "$GITHUB_WORKSPACE" --frozen python -m pytest -q -p no:cacheprovider

  vector-stores:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: nexura-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333"]
    env:
      NEXURA_TEST_POSTGRES_URI: postgresql://postgres:nexura-ci-only@127.0.0.1:5432/postgres
      NEXURA_TEST_QDRANT_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - run: uv run --frozen pytest tests/backend/b22 tests/postgres

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv build --all-packages
      - name: nexura-agents alone (no platform installed)
        run: |
          uv venv /tmp/agents --python 3.12
          uv pip install --python /tmp/agents/bin/python dist/nexura_agents-*.whl
          cd /tmp && env -u PYTHONPATH /tmp/agents/bin/python -I -c \
            "import nexura_agents, importlib.util as u; from nexura_agents import Agent, Runner, tool; assert u.find_spec('nexura_runtime') is None"
      - name: nexura-guardrails on nexura-agents alone (P39 G3)
        run: |
          dist="$PWD/dist"
          uv venv /tmp/guardrails --python 3.12
          py=/tmp/guardrails/bin/python
          uv pip install --python $py --find-links "$dist" "$dist"/nexura_agents-*.whl
          cd /tmp && env -u PYTHONPATH $py -I -c "import importlib.util as u; assert u.find_spec('nexura_guardrails') is None; from nexura_agents import block_pii"
          uv pip install --python $py --find-links "$dist" "$dist"/nexura_guardrails-*.whl
          cd /tmp && env -u PYTHONPATH $py -I -c "import asyncio, importlib.util as u; from nexura_agents import FakeModel; from nexura_guardrails import JudgeCheck, evaluate, injection, tiered
          j = JudgeCheck(FakeModel(['{\"decision\": \"block\", \"categories\": [\"fraud\"], \"score\": 0.9, \"reason\": \"otp\"}']), 'Block OTP requests.', categories=['fraud', 'other'])
          assert asyncio.run(evaluate(tiered(injection(), j), 'share your OTP')).decision == 'block'
          assert u.find_spec('nexura_runtime') is None"
      # Each step runs as one shell script, so after "cd /tmp" a relative "dist" no longer
      # names the workspace's dist/; the absolute "$dist" does.
      - name: nexura-runtime without nexura-connectors, then with it
        run: |
          dist="$PWD/dist"
          uv venv /tmp/connectors --python 3.12
          uv pip install --python /tmp/connectors/bin/python --find-links "$dist" "$dist"/nexura_runtime-*.whl
          cd /tmp && env -u PYTHONPATH /tmp/connectors/bin/python -I -c \
            "import importlib.util as u; from nexura_runtime.modules import default_registry as r; assert u.find_spec('nexura_connectors') is None; m = [x for x in r.list_modules() if x['module_id'].startswith('nexura.connectors.')]; assert len(m) == 15 and not any(x['is_available'] for x in m) and all('pip install nexura-connectors' in x['missing_reason'] for x in m)"
          uv pip install --python /tmp/connectors/bin/python --find-links "$dist" "$dist"/nexura_connectors-*.whl
          cd /tmp && env -u PYTHONPATH /tmp/connectors/bin/python -I -c \
            "from nexura_runtime.modules import default_registry as r; m = [x for x in r.list_modules() if x['module_id'].startswith('nexura.connectors.')]; assert len(m) == 15 and all(x['is_available'] for x in m)"
      - name: nexura-runtime without the backend packages, then with each (P28 step 10 stage 4b)
        run: |
          dist="$PWD/dist"
          uv venv /tmp/split --python 3.12
          py=/tmp/split/bin/python
          uv pip install --python $py --find-links "$dist" "$dist"/nexura_runtime-*.whl
          cd /tmp
          # Without them the runtime imports, and each feature names its package.
          env -u PYTHONPATH $py -I -c "import importlib.util as u; assert not any(u.find_spec(n) for n in ('nexura_postgres', 'nexura_qdrant', 'nexura_sandbox', 'nexura_studio', 'nexura_vertex', 'nexura_guardrails'))"
          env -u PYTHONPATH $py -I -c "from nexura_runtime.storage import get_storage_repository as g; from nexura_agents.contracts import MissingDependencyError as E
          try: g('postgresql://u:p@localhost/db'); raise SystemExit('no error')
          except E as e: assert 'pip install nexura-postgres' in str(e)"
          env -u PYTHONPATH $py -I -c "from nexura_runtime.integrations.sandbox import build_backend, SandboxConfig; assert all('pip install nexura-sandbox' in build_backend(n).probe(SandboxConfig()).reason for n in ('wasi', 'bubblewrap', 'gvisor_oci'))"
          env -u PYTHONPATH $py -I -c "from nexura_agents import infer_model; from nexura_agents.errors import SDKValidationError as E
          try: infer_model('vertex:gemini-2.5-flash'); raise SystemExit('no error')
          except E as e: assert 'pip install nexura-vertex' in str(e)"
          test ! -e /tmp/split/bin/nexura-studio
          uv pip install --python $py --find-links "$dist" "$dist"/nexura_postgres-*.whl "$dist"/nexura_qdrant-*.whl "$dist"/nexura_sandbox-*.whl "$dist"/nexura_studio-*.whl "$dist"/nexura_vertex-*.whl
          env -u PYTHONPATH $py -I -c "import nexura_postgres, nexura_qdrant; from nexura_runtime.storage import get_storage_repository as g; assert type(g('postgresql://u:p@localhost/db')) is nexura_postgres.PostgresRepository"
          env -u PYTHONPATH $py -I -c "import nexura_sandbox; from nexura_runtime.integrations.sandbox import build_backend; assert type(build_backend('gvisor_oci')) is nexura_sandbox.GVisorOCIWorker"
          env -u PYTHONPATH $py -I -c "import nexura_vertex, nexura_studio; from nexura_runtime.studio import create_app; assert create_app(db_path='/tmp/split-studio.sqlite3').title == 'Nexura Studio'"
          env -u PYTHONPATH /tmp/split/bin/nexura-studio --help
      - name: Clean consumer install (core, then studio extra)
        run: |
          dist="$PWD/dist"
          uv venv /tmp/consumer --python 3.12
          wheel=$(ls "$dist"/nexura_runtime-*.whl)
          uv pip install --python /tmp/consumer/bin/python --find-links "$dist" "$wheel"
          cd /tmp && env -u PYTHONPATH /tmp/consumer/bin/python -I -c \
            "import sys, nexura_runtime; assert 'fastapi' not in sys.modules; print(nexura_runtime.__file__)"
          uv pip install --python /tmp/consumer/bin/python --find-links "$dist" "$wheel[studio]"
          cd /tmp && env -u PYTHONPATH /tmp/consumer/bin/python -I -m nexura_runtime.cli.main serve --help
          env -u PYTHONPATH /tmp/consumer/bin/nexura-runtime --help
          # The bare "nexura" command belongs to the Nexura Cloud client package.
          test ! -e /tmp/consumer/bin/nexura
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  edition-boundary:
    # The public tree comes from an explicit allow-list; it must hold no closed-edition code
    # and must build and import on its own (EDITIONS_PLAN section 2.4).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv run --frozen python scripts/export_oss_tree.py /tmp/oss-tree
      - name: Exported tree builds and imports without the closed edition
        run: |
          cd /tmp/oss-tree && uv build --all-packages
          uv venv /tmp/oss-consumer --python 3.12
          uv pip install --python /tmp/oss-consumer/bin/python --find-links dist dist/nexura_runtime-*.whl
          cd /tmp && env -u PYTHONPATH /tmp/oss-consumer/bin/python -I -c \
            "import importlib.util as u, nexura_runtime; assert u.find_spec('nexura_enterprise') is None"

  typescript-client:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

  studio-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: uv sync --frozen --all-extras
      - run: npm ci
        working-directory: clients/typescript
      - run: npm run build
        working-directory: clients/typescript
      - working-directory: studio-web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
